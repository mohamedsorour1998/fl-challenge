apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fsl-challenge
spec:
  ingressClassName: traefik
  rules:
  - host: "fsl-challenge.me"
    http:
      paths:
      - pathType: Prefix
        path: "/"
        backend:
          service:
            name: fsl-challenge
            port:
              number: 8080