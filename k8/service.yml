apiVersion: v1
kind: Service
metadata:
  name: fsl-challenge
spec:
  ports:
  - port: 8080
    name: web
  clusterIP: None
  selector:
    app: fsl-challenge
---
apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: fsl-challenge
  labels:
    app: fsl-challenge
spec:
  serviceName: fsl-challenge
  replicas: 3
  selector:
    matchLabels:
      app: fsl-challenge
  template:
    metadata:
      labels:
        app: fsl-challenge
    spec:
      containers:
      - name: fsl-challenge
        image: fsl-challenge:local
        ports:
        - containerPort: 8080